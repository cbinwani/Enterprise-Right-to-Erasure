<!doctype html><html><head><meta charset="utf-8"><title>Sample Web Application</title><style>body{font-family:Arial;margin:30px;background:#f5f7fa}.card{background:white;padding:20px;border-radius:10px}button{padding:8px}</style></head><body><div class="card"><h1>Sample Modern Web Application</h1><p>This is a demo customer system targeted by the RTBF platform.</p><div id="data"></div></div><script>async function load(){let r=await fetch('/api/customers');let d=await r.json();document.getElementById('data').innerHTML='<pre>'+JSON.stringify(d,null,2)+'</pre>'}load();setInterval(load,2000)</script></body></html>
