<!doctype html><html><head><meta charset="utf-8"><title>Audit Log</title><style>body{font-family:Arial;background:#f4f7fb;margin:0;color:#172033}nav{background:#10233f;color:#fff;padding:15px}nav a{color:#fff;margin-right:18px;text-decoration:none}main{max-width:1400px;margin:25px auto}.card{background:#fff;padding:22px;border-radius:10px;box-shadow:0 2px 10px #0001}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #ddd;text-align:left;font-size:13px}.success{color:#166534}.error{color:#991b1b}</style></head><body><nav><b>Privacy Control Plane</b> <a href="/">Request</a><a href="/exclusion">Exclusion List</a><a href="/audit">Audit Log</a></nav><main><div class="card"><h1>Audit Log</h1><p>Execution evidence generated by the privacy control plane.</p><div id="table"></div></div></main><script>async function load(){const d=await (await fetch('/api/audit-log')).json();document.getElementById('table').innerHTML='<table><tr><th>Timestamp</th><th>Request</th><th>Actor</th><th>Event</th><th>Status</th><th>Detail</th></tr>'+d.records.slice().reverse().map(x=>`<tr><td>${x.timestamp}</td><td>${x.request_id}</td><td>${x.actor}</td><td>${x.event}</td><td class="${x.status==='SUCCESS'?'success':x.status==='ERROR'?'error':''}">${x.status}</td><td>${x.detail}</td></tr>`).join('')+'</table>'}load();setInterval(load,3000)</script></body></html>
