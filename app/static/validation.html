<!doctype html><html><head><meta charset="utf-8"><title>RTBF Validation</title><style>body{font-family:Arial;background:#f4f7fb;margin:0;color:#172033}nav{background:#10233f;color:#fff;padding:15px}nav a{color:#fff;margin-right:18px;text-decoration:none}main{max-width:1200px;margin:25px auto}.card{background:#fff;padding:22px;border-radius:10px;box-shadow:0 2px 10px #0001;margin-bottom:16px}.ok{color:#166534;background:#dcfce7;padding:6px 10px;border-radius:20px}.wait{color:#92400e;background:#fef3c7;padding:6px 10px;border-radius:20px}table{width:100%;border-collapse:collapse}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left}pre{background:#0f172a;color:#dbeafe;padding:15px;overflow:auto}</style></head><body><nav><b>Privacy Control Plane</b> <a href="/">Request</a><a href="/exclusion">Exclusion List</a><a href="/audit">Audit Log</a></nav><main><div class="card"><h1>RTBF Validation</h1><p>Enter the request ID after submitting the request.</p><input id="rid" style="width:420px;padding:10px"><button onclick="load()">Validate</button></div><div id="out"></div></main><script>async function load(){const rid=document.getElementById('rid').value.trim();if(!rid)return;const r=await fetch('/api/validation/'+encodeURIComponent(rid));const d=await r.json();document.getElementById('out').innerHTML=`<div class="card"><h2>Overall Result: <span class="${d.status==='COMPLETED'?'ok':'wait'}">${d.status}</span></h2><p><b>Action:</b> ${d.action}</p><h3>System Execution</h3>${table(d.systems,['system','action','status','record_ref','detail'])}<h3>Independent Verification</h3>${table(d.verification,['system','status'])}<h3>Agent Trace</h3><pre>${JSON.stringify(d.agent_trace,null,2)}</pre><h3>Exclusion Record</h3><pre>${JSON.stringify(d.exclusion,null,2)}</pre></div>`;if(!['COMPLETED','PARTIAL_FAILURE','POLICY_REVIEW'].includes(d.status))setTimeout(load,1000)}function table(rows,cols){return '<table><tr>'+cols.map(c=>'<th>'+c+'</th>').join('')+'</tr>'+rows.map(x=>'<tr>'+cols.map(c=>'<td>'+((x[c]??''))+'</td>').join('')+'</tr>').join('')+'</table>'}</script></body></html>
