<!doctype html><html><head><meta charset="utf-8"><title>Sample COTS CRM</title><style>body{font-family:Arial;margin:30px;background:#eef2f7}.card{background:white;padding:20px;border-radius:10px}</style></head><body><div class="card"><h1>Sample COTS CRM</h1><p>Vendor-style application with a privacy execution endpoint.</p><pre id="data"></pre></div><script>async function load(){let r=await fetch('/api/v1/contacts');document.getElementById('data').textContent=JSON.stringify(await r.json(),null,2)}load();setInterval(load,2000)</script></body></html>
