<!doctype html><html><head><meta charset="utf-8"><title>Exclusion List</title><style>body{font-family:Arial;background:#f4f7fb;margin:0;color:#172033}nav{background:#10233f;color:#fff;padding:15px}nav a{color:#fff;margin-right:18px;text-decoration:none}main{max-width:1200px;margin:25px auto}.card{background:#fff;padding:22px;border-radius:10px;box-shadow:0 2px 10px #0001}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #ddd;text-align:left}.pill{padding:5px 8px;border-radius:18px;background:#dcfce7}pre{background:#0f172a;color:#dbeafe;padding:15px;overflow:auto}</style></head><body><nav><b>Privacy Control Plane</b> <a href="/">Request</a><a href="/exclusion">Exclusion List</a><a href="/audit">Audit Log</a></nav><main><div class="card"><h1>Enterprise Exclusion List</h1><p>Authoritative JSON-backed list used to suppress future customer processing.</p><p><a href="/api/exclusion-list" target="_blank">Open JSON API</a> | <a href="/api/exclusion-list/export" target="_blank">Export JSON</a></p><div id="table"></div><h2>Downstream Guard Test</h2><input id="email" value="alice@example.com"><button onclick="check()">Check</button><pre id="result"></pre></div></main><script>async function load(){const d=await (await fetch('/api/exclusion-list')).json();document.getElementById('table').innerHTML='<table><tr><th>ID</th><th>Request</th><th>Subject</th><th>Status</th><th>Reason</th><th>Created</th></tr>'+d.records.map(x=>`<tr><td>${x.exclusion_id}</td><td>${x.request_id}</td><td>${x.subject_masked}</td><td><span class="pill">${x.status}</span></td><td>${x.reason}</td><td>${x.created_at}</td></tr>`).join('')+'</table>'}async function check(){const d=await (await fetch('/api/ingestion/decision',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({subject_value:document.getElementById('email').value})})).json();document.getElementById('result').textContent=JSON.stringify(d,null,2)}load();setInterval(load,3000)</script></body></html>
